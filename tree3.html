```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CBSE - Vignan's World One School</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
        }

        /* =========================
           SCHOOL LOGO
        ========================== */

        .top-bar {
            background-color: white;
            padding: 10px 20px;
            height: 90px;
            display: flex;
            align-items: center;
        }

        .top-bar img {
            width: 250px;
            height: auto;
        }


        /* =========================
           CBSE HEADER
        ========================== */

        .header {
            background: linear-gradient(to right, #003366, #005599);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 40px;
            margin: 0 0 15px 0;
        }

        .header p {
            font-size: 18px;
            margin: 0;
        }


        /* =========================
           ABOUT CBSE
        ========================== */

        .content {
            padding: 50px 40px;
            text-align: center;
            background-color: #f4f8fb;
        }

        .content h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 17px;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 900px;
        }


        /* =========================
           CAMPUS VIEW
        ========================== */

        .slide-section {
            background-color: #f4f8fb;
            padding: 30px 0 50px 0;
            text-align: center;
        }

        .campus-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .campus-header h2 {
            font-size: 28px;
            margin: 0;
        }


        /* =========================
           CAMPUS IMAGE
        ========================== */

        .slide-image {
            width: 80%;
            max-width: 1400px;
            margin: auto;
        }

        .slide-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }


        /* =========================
           MOBILE VIEW
        ========================== */

        @media (max-width: 768px) {

            .top-bar {
                height: auto;
                justify-content: center;
                padding: 15px;
            }

            .top-bar img {
                width: 200px;
            }

            .header {
                padding: 45px 15px;
            }

            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 16px;
            }

            .content {
                padding: 35px 20px;
            }

            .content h2 {
                font-size: 24px;
            }

            .content p {
                font-size: 15px;
            }

            .campus-header h2 {
                font-size: 24px;
            }

            .slide-image {
                width: 92%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SCHOOL LOGO
    ========================== -->

    <div class="top-bar">

        <img src="logo.png" alt="Vignan's World One School Logo">

    </div>


    <!-- =========================
         CBSE HEADER
    ========================== -->

    <div class="header">

        <h1>CBSE Block</h1>

        <p>Explore the CBSE learning path</p>

    </div>


    <!-- =========================
         ABOUT CBSE
    ========================== -->

    <div class="content">

        <h2>About CBSE</h2>

        <p>
            The CBSE curriculum focuses on conceptual understanding,
            critical thinking, and global learning standards.
        </p>

    </div>


    <!-- =========================
         CAMPUS VIEW
    ========================== -->

    <section class="slide-section">

        <div class="campus-header">

            <h2>Campus View</h2>

        </div>


        <div class="slide-image">

            <img
                src="cbseveiws.png"
                alt="Vignan's World One School Campus"
            >

        </div>

    </section>


</body>

</html>
```
